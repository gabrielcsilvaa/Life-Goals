name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5432'
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: isolated-ci-password
      TEST_DB_NAME: test_lifegoals_audit_ci
      PG_BIN_DIR: /usr/lib/postgresql/16/bin
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.lock}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: bash scripts/install_pg_tools.sh
      - run: /usr/lib/postgresql/18/bin/pg_dump --version && age --version
      - run: npm ci
        working-directory: mobile
      - run: npx playwright install --with-deps chromium
        working-directory: mobile
      - run: python backend/manage.py check --settings=config.test_settings
      - run: python backend/manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: python -m ruff check backend scripts/check_migration_plan.py scripts/backup_database.py
      - run: python -m ruff format --check backend scripts/check_migration_plan.py scripts/backup_database.py
      - run: python -m pytest -c backend/pytest.ini backend/tests --ds=config.postgres_test_settings -q
        env: {LIFEGOALS_RUN_UI: '1'}
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck && npm run lint && npm test
        working-directory: mobile
      - run: npx playwright install --with-deps chromium
        working-directory: mobile
      - run: npm run test:e2e
        working-directory: mobile
      - run: npm run build:pwa && npm run check:pwa
        working-directory: mobile
        env: {EXPO_PUBLIC_DEMO_ONLY: 'true'}
      - run: npx playwright test --config playwright.pwa.config.ts
        working-directory: mobile
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - run: python scripts/check_secrets.py
      - run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements.lock --disable-pip --no-deps
      - run: npm audit --audit-level=high
        working-directory: mobile
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: docker build --tag lifegoals-backend:ci .
  required:
    name: ci-required
    runs-on: ubuntu-24.04
    if: always()
    needs: [backend, frontend, security, container]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "Required checks failed; deployment is forbidden"'
