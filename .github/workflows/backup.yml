name: Encrypted PostgreSQL backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
concurrency:
  group: production-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Verify configured backup provider
        env: {PROVIDER: '${{ vars.BACKEND_PROVIDER }}'}
        run: test "$PROVIDER" = render
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - name: Install reviewed backup tools
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          bash scripts/install_pg_tools.sh
          mkdir -m 700 "$RUNNER_TEMP/db-backup"
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_DIR: ${{ runner.temp }}/db-backup
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          python scripts/backup_database.py
      - name: Retain encrypted recovery artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encrypted-daily-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/db-backup/*.dump.age
          if-no-files-found: error
          retention-days: 14
