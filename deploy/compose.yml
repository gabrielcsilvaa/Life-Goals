services:
  backend:
    image: ${LIFEGOALS_IMAGE:?Set an immutable image tag or digest}
    restart: unless-stopped
    env_file: /opt/lifegoals/backend.env
    environment:
      DJANGO_SETTINGS_MODULE: config.production_settings
      APP_VERSION: ${APP_VERSION:?Set release commit}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/lifegoals/certs:/run/certs:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
    stop_grace_period: 30s
